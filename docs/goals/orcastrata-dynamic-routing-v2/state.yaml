version: 2

goal:
  title: "Orcastrata Dynamic Routing V2"
  slug: orcastrata-dynamic-routing-v2
  kind: implementation
  tranche: >-
    Consolidate provider execution, make automatic PM-led routing primary,
    add real isolated implementation, compact evidence, and prove the installed journey.
  status: done
  oracle:
    signal: >-
      A normal natural-language task dynamically selects and executes a useful
      exact worker without requiring the user to name it, while exact overrides,
      fan-out, writes, receipts, and safety boundaries remain correct.
    cadence: "after each milestone and final audit"
    final_proof: >-
      Focused and consumer tests, clean package parity, workspace-local clean
      install, live provider journeys, real isolated implementation, rollback,
      and independent audit.
  intake:
    original_request: >-
      Make Orcastrata dynamically route useful worker execution during normal
      conversation without requiring the user to choose worker models.
    interpreted_outcome: >-
      Deliver a lean installed runtime where the Parent decides delegation and
      the router selects exact eligible workers, while exact overrides remain available.
    input_shape: ordinary_language
    audience: "Orcastrata operators"
    authority: approved
    proof_type: behavioral
    completion_proof: >-
      A fresh installed natural-language task delegates without a named worker,
      completes useful work, reports the exact invoked route, and preserves all
      exact override, fan-out, write, rollback, and failure boundaries.
    likely_misfire: >-
      Add more policy and receipts without proving the ordinary conversation path.
    blind_spots_considered:
      - "Skill guidance versus deterministic host invocation"
      - "Read-only canary versus real implementation"
      - "Fresh task-local preflight versus persistent qualification"
      - "Automatic selection quality versus static priority"
      - "Raw evidence volume versus durable proof"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  pm_routes_safe_successors: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

