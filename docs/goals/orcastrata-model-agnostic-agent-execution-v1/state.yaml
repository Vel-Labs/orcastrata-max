version: 2

goal:
  title: "Orcastrata Model-Agnostic Agent Execution V1"
  slug: orcastrata-model-agnostic-agent-execution-v1
  kind: implementation
  tranche: >-
    Prove one installed external read-only task, generalize exact model
    onboarding over approved transports, add automatic routing, controlled
    writes, explicit fan-out, and installed acceptance.
  status: done
  oracle:
    signal: >-
      An installed successor configures a non-hardcoded exact model through an
      approved transport, executes and validates compatible read and controlled
      write tasks, reports invoked identity and usage truthfully, and runs an
      explicit three-model adversarial fan-out.
    cadence: "after each milestone and final audit"
    final_proof: >-
      Focused and consumer tests, package parity, reversible install, real
      provider receipts, exact artifacts and diffs, and independent Luna audit.
  intake:
    original_request: >-
      Fix Orcastrata so configured models routinely carry out tasks, and let an
      operator configure model X through runtime Y as an agent.
    interpreted_outcome: >-
      Deliver a model-declarative, adapter-controlled, installed orchestration
      journey with real task execution and truthful receipts.
    input_shape: ordinary_language
    audience: "Orcastrata operators and repository agents"
    authority: approved
    proof_type: behavioral
    completion_proof: "Installed real-provider execution plus independent audit."
    likely_misfire: >-
      Add more route configuration and synthetic tests without making an
      installed operator task reach a provider process.
    blind_spots_considered:
      - "Dirty source checkout versus installed 1.0.3 identity"
      - "Closed transport safety versus declarative model extensibility"
      - "Configured versus qualified versus invoked state"
      - "Task-scoped development versus T062 protected production"
      - "Ordered fallback versus explicit fan-out"
      - "Provider identity, billing, usage, and isolation drift"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  pm_routes_safe_successors: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

