version: 2

goal:
  title: "Orcastrata Standalone GitHub Umbrella Workflow V1"
  slug: orcastrata-aol-github-umbrella-v1
  kind: implementation
  tranche: "Prepare the standalone open-source Orcastrata GitHub umbrella workflow."
  status: done
  oracle:
    signal: >-
      An authorized test repository completes the standalone umbrella-to-merge
      journey with current Orcastrata, GoalBuddy, WorkGraph, GitHub, and audit receipts.
    cadence: "after each implementation milestone and final independent audit"
    final_proof: >-
      Focused contract tests, fake-gh behavioral tests, isolated real-gh read-only
      proof, authorized test-repository canaries, reconciliation proof, PR lifecycle
      proof, umbrella audit, and guarded merge proof.
  intake:
    original_request: >-
      Plan and adversarially review GitHub umbrella execution for open-source
      Orcastrata, then give closed-source AOL a separate integration handoff.
    interpreted_outcome: >-
      Produce a decision-complete standalone Orcastrata plan and a distinct AOL
      consumer handoff without implementing external effects.
    input_shape: ordinary_language
    audience: "Orcastrata implementers and AOL integration owners"
    authority: >-
      standing_t050b_through_t999_for_github.com_Vel-Labs_orcastrata-max_with_exact_repository_write_pr_and_guarded_merge_scope
    proof_type: behavioral
    completion_proof: >-
      Corrected plan, separate AOL handoff, exact identity and repository permission
      receipt, synchronized GitHub artifacts, guarded PR lifecycle, standalone
      dogfood, independent audit, and terminal board closeout.
    likely_misfire: "Make Orcastrata depend on AOL or let gh authentication imply mutation authority."
    blind_spots_considered:
      - "Orcastrata is an independent open-source product"
      - "AOL is a closed-source downstream product"
      - "Local inherited gh authentication"
      - "GitHub as synchronized surface rather than sole canonical truth"
      - "Context growth across umbrella, issue, PR, and audit scopes"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  pm_routes_safe_successors: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

tasks:
