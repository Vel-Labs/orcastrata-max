    type: pm
    assignee: PM
    status: done
    objective: "Freeze, adversarially review, correct, and validate the standalone plan."
    dependencies: []
    allowed_files:
      - docs/goals/orcastrata-aol-github-umbrella-v1/
    expected_output:
      - "Reviewed Orcastrata implementation plan, AOL handoff, and provider receipts"
    verify:
      - "python3 plugins/codexmax-orchestrator/scripts/validate_implementation_plan.py --repo-root . --plan docs/goals/orcastrata-aol-github-umbrella-v1/notes/orcastrata-github-umbrella-plan.md --state docs/goals/orcastrata-aol-github-umbrella-v1/state.yaml"
    receipt:
      result: done
      decision: revise
      full_outcome_complete: false
      summary: >-
        Grok 4.6 and MiniMax M3 returned REVISE. DeepSeek V4 Pro failed exact
        identity verification before a provider call. The Parent retained the
        useful transport, idempotency, worker-scope, and audit findings. After
        operator correction, the Parent split standalone Orcastrata implementation
        from the downstream AOL product handoff. No provider reviewed this split.

