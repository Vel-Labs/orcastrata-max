  - Existing T080 request/state replay and default API behavior remain compatible.
  - Arbitrary paths, task names, auditor identities, repositories, commands, and merge methods remain impossible.
  - Existing fresh SHA, scope, rules, checks, reviews, identity, permission, lock, and unknown-outcome gates remain unchanged.
