  - tests/test_github_cli_read.py
questions:
  - Does an unknown merge outcome remain reconcile-required under every later PR drift, failure, closed, merged, or stale-gate observation?
  - Does the seam prove dependencies and independent audit from canonical evidence, or only trust caller-supplied fields?
  - Can branch protection or repository rulesets produce a false pass rather than a safe failure?
  - Are exact identity, permission, repository, PR marker, SHA, scope, checks, reviews, conflict, and one-effect guarantees closed and tested?
  - Can caller-selected paths, command fields, environment, credentials, merge methods, or arbitrary gh behavior enter the effect?
forbidden_actions:
  - Any file write, network, GitHub or Git effect, board mutation, acceptance mutation, credential access, provider, AOL, schedule, deployment, release, or merge.
result:
  - Return ACCEPT, REVISE, or BLOCKED with typed findings, exact file and line evidence, required repair, and proof boundary.
